# SPDX-License-Identifier: GPL-3.0-or-later
# Optional, manual: runs Compose UI and Room instrumented tests on an emulator.
# Uses one third-party action (reactivecircus/android-emulator-runner) because GitHub has no
# first-party emulator action. Review it before enabling, and pin it to a commit SHA you trust.
name: Instrumented tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
